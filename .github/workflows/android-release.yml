name: Build Android Release APK
on:
  push:
    branches: [ "mcp-main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: "stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Decode keystore (from secret)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/release.keystore

      - name: Write key.properties for Android signing
        run: |
          mkdir -p android
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore/release.keystore
          EOF
        working-directory: android

      - name: Flutter pub get
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build signed APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

Notes:
- Required repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
- KEYSTORE_BASE64 should be the base64-encoded contents of your keystore file. You can create it locally with: base64 release.keystore | pbcopy (mac) or base64 release.keystore > release.keystore.b64
- If you prefer to store the keystore directly in the repository (not recommended), modify the workflow to skip decoding and point storeFile to the correct path.
- If you want an AAB instead, change the build step to `flutter build appbundle --release` and adjust the uploaded artifact path accordingly.