name: Android Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish APK to GitHub Release"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - mcp-main
    tags:
      - 'v*'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Read App Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APP_VERSION="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION#*+}"
          if [[ "$RAW_VERSION" == "$APP_VERSION" ]]; then
            BUILD_NUMBER="0"
          fi

          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Prepare Android signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app

          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 || '' }}" ]]; then
            echo "Using release keystore from GitHub Secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

            cat > android/key.properties <<EOF
            storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            storeFile=app/release.keystore
            EOF
          else
            echo "No signing secrets found, generating fallback debug keystore"

            keytool -genkeypair \
              -v \
              -storetype JKS \
              -keystore android/app/debug-signing.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            cat > android/key.properties <<EOF
            storePassword=android
            keyPassword=android
            keyAlias=androiddebugkey
            storeFile=app/debug-signing.keystore
            EOF
          fi

      - name: Get Flutter dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "Attempt $i: flutter pub get"
            if flutter pub get; then
              exit 0
            fi
            echo "flutter pub get failed, retrying..."
            sleep 10
          done
          echo "flutter pub get failed after 3 attempts"
          exit 1

      - name: Generate localization
        shell: bash
        run: flutter gen-l10n

      - name: Build Android APK (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            echo "Attempt $i: flutter build apk --release"
            if flutter build apk --release; then
              exit 0
            fi
            echo "Build failed, retrying after cleanup..."
            flutter clean
            flutter pub get
            sleep 15
          done
          echo "Android build failed after retries"
          exit 1

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/proxypin-android.apk

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/proxypin-android.apk \
             dist/proxypin-mcp-android-${APP_VERSION}.apk
          ls -lah dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-mcp-android-${{ steps.version.outputs.app_version }}
          path: dist/proxypin-mcp-android-${{ steps.version.outputs.app_version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          generate_release_notes: true
          files: dist/proxypin-mcp-android-${{ steps.version.outputs.app_version }}.apk